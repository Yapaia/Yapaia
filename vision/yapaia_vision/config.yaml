name: Yapaia Vision
version: "0.1.0"
slug: yapaia_vision
description: >-
  Analoge Kameras (z. B. Rückfahrkamera) über einen USB-Video-Grabber wie den
  EasyCAP 4CH USB DVR als Kameras in Home Assistant.
url: https://github.com/Yapaia/yapaia
# Fertiges Image aus .github/workflows/images.yml -- der Supervisor zieht
# `<image>:<version>` statt auf dem Gerät zu bauen.
image: "ghcr.io/yapaia/yapaia-vision-{arch}"
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:cctv
panel_title: Yapaia Vision
usb: true
udev: true
video: true
homeassistant_api: true
hassio_api: true
discovery:
  - yapaia
map:
  - type: homeassistant_config
    read_only: false
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Optional: Web-Oberfläche und MJPEG-Ströme im lokalen Netz"
options:
  testbild: false
  geraet: auto
  norm: PAL
  aufloesung: "720x576"
  bilder_pro_sekunde: 25
  qualitaet: 5
  entflechten: true
  nachlauf_s: 60
  immer_an: false
  kanaele:
    - name: Rückfahrkamera
    - name: Kamera 2
    - name: Kamera 3
    - name: Kamera 4
  install_integration: true
  log_level: info
schema:
  testbild: bool
  geraet: str
  norm: list(PAL|NTSC|SECAM)
  aufloesung: match(^[0-9]{2,4}x[0-9]{2,4}$)
  bilder_pro_sekunde: int(1,30)
  qualitaet: int(2,31)
  entflechten: bool
  nachlauf_s: int(0,3600)
  immer_an: bool
  kanaele:
    - name: str
      geraet: str?
      eingang: int(0,15)?
  install_integration: bool
  log_level: list(debug|info|warning|error)
