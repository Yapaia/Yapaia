<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapaia Vision</title>
<style>
  /* Aus dem Yapaia-Design-Schema (docs/design-schemata.md), Rückfall: bisheriges Aussehen */
  :root { --bg: var(--y-grund, #111418); --karte: var(--y-flaeche, #1b2028); --rand: var(--y-rand, #2c3340); --text: var(--y-text, #e8eaed);
          --blass: var(--y-text-gedaempft, #9aa3b2); --akzent: var(--y-akzent, #c8794a); color-scheme: dark; }
  :root[data-y-hell="true"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 var(--y-schrift-text, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
  h1 small { color: var(--blass); font-weight: 400; font-size: 13px; }
  .knoepfe { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .knoepfe button { background: var(--karte); color: var(--text); border: 1px solid var(--rand); border-radius: 8px;
    padding: 8px 14px; font: inherit; cursor: pointer; }
  .knoepfe button.an { background: var(--akzent); border-color: var(--akzent); color: var(--y-akzent-text, #14161b); font-weight: 600; }
  .raster { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  figure { margin: 0; background: #000; border: 1px solid var(--rand); border-radius: 10px; overflow: hidden; }
  figure img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #000; }
  figcaption { padding: 8px 12px; background: var(--karte); display: flex; justify-content: space-between; gap: 8px; }
  figcaption span:last-child { color: var(--blass); }
  .hinweis { background: rgba(var(--y-akzent-rgb, 200, 121, 74), .18); border: 1px solid var(--akzent); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
  details { margin-top: 16px; color: var(--blass); }
  pre { white-space: pre-wrap; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Yapaia Vision <small id="geraet"></small></h1>
  <div id="hinweise"></div>
  <form class="hinweis" id="firmware" hidden>
    <b data-t="fw_titel">Firmware für den EasyCAP</b><br>
    <span data-t="fw_hinweis_1">Treiberdatei von der CD zum Stick wählen:</span> <code>SmiUsbGrabber3F.sys</code>,
    <code>SmiUsbGrabber3E.sys</code> <span data-t="fw_oder">oder das ganze</span> <code>Setup.exe</code>.<br>
    <input type="file" id="fw-datei"> <button type="submit" data-t="hochladen">Hochladen</button>
    <div id="fw-antwort"></div>
  </form>
  <div class="knoepfe" id="knoepfe"></div>
  <div class="raster" id="raster"></div>
  <details><summary data-t="technik">Technik</summary><pre id="technik"></pre></details>
</main>
<script>
// Texte je Sprache (docs/sprachen.md): HA-Sprache über die Integration (api/sprache),
// sonst Browsersprache; Deutsch oder sonst Englisch
const TEXTE = {
  de: {
    fw_titel: "Firmware für den EasyCAP",
    fw_hinweis_1: "Treiberdatei von der CD zum Stick wählen:",
    fw_oder: "oder das ganze",
    hochladen: "Hochladen",
    technik: "Technik",
    lade_hoch: "Lade hoch …",
    eingang: "{geraet} · Eingang {eingang}",
  },
  en: {
    fw_titel: "Firmware for the EasyCAP",
    fw_hinweis_1: "Choose the driver file from the CD for the stick:",
    fw_oder: "or the whole",
    hochladen: "Upload",
    technik: "Technical details",
    lade_hoch: "Uploading …",
    eingang: "{geraet} · input {eingang}",
  },
};
let SPRACHE = String(navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en";
const t = (schluessel, werte = {}) =>
  String(TEXTE[SPRACHE]?.[schluessel] ?? TEXTE.en[schluessel] ?? schluessel).replace(/\{(\w+)\}/g, (_, k) => werte[k] ?? "");
// Feste Texte im HTML: data-t="schluessel" (Inhalt), data-t-title, data-t-aria, data-t-ph (placeholder)
function texteSetzen(wurzel = document) {
  document.documentElement.lang = SPRACHE;
  for (const el of wurzel.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  for (const el of wurzel.querySelectorAll("[data-t-title]")) el.title = t(el.dataset.tTitle);
  for (const el of wurzel.querySelectorAll("[data-t-aria]")) el.setAttribute("aria-label", t(el.dataset.tAria));
  for (const el of wurzel.querySelectorAll("[data-t-ph]")) el.placeholder = t(el.dataset.tPh);
}
async function spracheLaden() {
  try {
    const d = await (await fetch("api/sprache", { cache: "no-store" })).json();
    if (d?.sprache === "de" || d?.sprache === "en") SPRACHE = d.sprache;
  } catch {}
  texteSetzen();
}
  // Relative Pfade: die Seite läuft hinter dem Ingress von Home Assistant.
  const $ = (id) => document.getElementById(id);
  let gezeigt = '';
  let stroeme = [];

  // ─── WARUM EINZELBILDER STATT MJPEG-STROM ───────────────────────────────
  // Zwei Hürden, beide am 2026-10-16 am echten Gerät gesehen:
  // 1. Der Ingress von Home Assistant reicht vom Content-Type nur den Teil vor
  //    dem „;“ weiter -- die `boundary` fehlt, ein <img> mit dem Strom bleibt
  //    schwarz.
  // 2. Den Strom selbst per fetch() zu lesen, klappt in Chrome, aber nicht in
  //    der Companion-App auf dem iPad: dort kommt kein einziges Stück an.
  // Einzelbilder (bild.jpg, mit Länge) gehen überall durch. Das jeweils
  // nächste wird geholt, sobald das vorige da ist -- im lokalen Netz sind das
  // 10–25 Bilder pro Sekunde.
  function zeigeStrom(img, url) {
    const abbruch = new AbortController();
    stroeme.push(abbruch);
    let alt = null;
    (async () => {
      while (!abbruch.signal.aborted) {
        try {
          const antwort = await fetch(`${url}?t=${Date.now()}`, { signal: abbruch.signal, cache: 'no-store' });
          if (!antwort.ok) throw new Error(antwort.status);
          const bild = URL.createObjectURL(await antwort.blob());
          img.src = bild;
          if (alt) URL.revokeObjectURL(alt);
          alt = bild;
          await new Promise((r) => setTimeout(r, 40));
        } catch (e) {
          if (abbruch.signal.aborted) return;
          await new Promise((r) => setTimeout(r, 1000));
        }
      }
    })();
  }

  async function laden() {
    let st;
    try { st = await (await fetch('api/status', { cache: 'no-store' })).json(); } catch { return; }
    $('geraet').textContent = `${st.geraet} · ${st.version}`;
    $('technik').textContent = JSON.stringify(st, null, 2);
    $('firmware').hidden = !st.firmware_fehlt;

    const meldungen = [...st.hinweise, ...st.kanaele.map((k) => k.fehler).filter(Boolean)];
    $('hinweise').replaceChildren(...[...new Set(meldungen)].map((t) => {
      const d = document.createElement('div'); d.className = 'hinweis'; d.textContent = t; return d;
    }));

    // Kanäle, die sich einen Grabber teilen: Knöpfe und EIN Live-Bild.
    // Kanäle mit eigenem Gerät: jeder sein eigenes Live-Bild.
    const proGeraet = {};
    for (const k of st.kanaele) if (k.geraet) (proGeraet[k.geraet] ||= []).push(k);
    const geteilt = Object.values(proGeraet).filter((l) => l.length > 1).flat();
    const live = st.kanaele.filter((k) => k.geraet && (!geteilt.includes(k) || k.gewaehlt));

    $('knoepfe').replaceChildren(...geteilt.map((k) => {
      const b = document.createElement('button');
      b.textContent = k.name;
      b.className = k.gewaehlt ? 'an' : '';
      b.onclick = async () => {
        await fetch('api/kanal', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kanal: k.nummer }) });
        laden();
      };
      return b;
    }));

    const schluessel = live.map((k) => k.nummer).join(',');
    if (schluessel !== gezeigt) {
      gezeigt = schluessel;
      for (const a of stroeme) a.abort();
      stroeme = [];
      $('raster').replaceChildren(...live.map((k) => {
        const f = document.createElement('figure');
        const img = document.createElement('img');
        img.alt = k.name;
        zeigeStrom(img, `api/kamera/${k.nummer}/bild.jpg`);
        const c = document.createElement('figcaption');
        c.innerHTML = '<span></span><span></span>';
        c.firstChild.textContent = k.name;
        c.lastChild.textContent = t('eingang', { geraet: k.geraet, eingang: k.eingang });
        f.append(img, c);
        return f;
      }));
    }
  }
  $('firmware').onsubmit = async (ev) => {
    ev.preventDefault();
    const datei = $('fw-datei').files[0];
    if (!datei) return;
    const form = new FormData();
    form.append('datei', datei);
    $('fw-antwort').textContent = t('lade_hoch');
    try {
      const r = await (await fetch('api/firmware', { method: 'POST', body: form })).json();
      $('fw-antwort').textContent = r.ok ? r.text : r.fehler;
    } catch (e) {
      $('fw-antwort').textContent = String(e);
    }
  };
  // Sprache zuerst holen, dann erst zeichnen; danach folgt die Seite einer Änderung
  spracheLaden().then(() => {
    laden();
    setInterval(laden, 3000);
    setInterval(async () => {
      const alt = SPRACHE;
      await spracheLaden();
      if (alt !== SPRACHE) { gezeigt = ''; laden(); }
    }, 60000);
  });

// ---- Yapaia Design (docs/integration-protokoll.md §8a) --------------------
async function designHolen() {
  try {
    const d = await (await fetch("api/design", { cache: "no-store" })).json();
    const s = d && d.schema;
    if (!s || !s.css) return;
    const root = document.documentElement;
    for (const [k, v] of Object.entries(s.css)) root.style.setProperty(k, v);
    root.dataset.ySchema = s.id;
    root.dataset.yHell = String(s.hell);
    if (d.schriften && location.pathname.includes("/api/hassio_ingress/") && !document.querySelector(`link[href="${d.schriften}"]`)) {
      const l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = d.schriften;
      document.head.appendChild(l);
    }
  } catch { /* ohne Integration: eigenes Aussehen */ }
}
designHolen();
setInterval(designHolen, 60000);
</script>
</body>
</html>
