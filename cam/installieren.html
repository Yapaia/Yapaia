<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapaia Cam</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 1.4rem system-ui, sans-serif; margin: 2rem; }
</style>
</head>
<body>
<p id="text"></p>
<script>
// Diese Seite ändert sich nie; die Version kommt frisch aus yapaia-cam.json.
// Der Link auf die APK trägt ?v=<versionCode> – so kann kein Zwischenspeicher
// eine alte APK ausliefern.
const TEXTE = {
  de: { laedt: "Lade Yapaia Cam {v} …", fehler: "Keine Version gefunden: {f}" },
  en: { laedt: "Downloading Yapaia Cam {v} …", fehler: "No version found: {f}" },
};
const t = TEXTE[(navigator.language || "en").startsWith("de") ? "de" : "en"];
const text = document.getElementById("text");
fetch("yapaia-cam.json", { cache: "no-store" })
  .then((r) => r.json())
  .then((s) => {
    text.textContent = t.laedt.replace("{v}", s.versionName);
    location.href = "yapaia-cam.apk?v=" + s.versionCode;
  })
  .catch((e) => { text.textContent = t.fehler.replace("{f}", e.message); });
</script>
</body>
</html>
