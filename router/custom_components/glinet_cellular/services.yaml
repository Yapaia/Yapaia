rpc_call:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: glinet_cellular
    service:
      required: true
      example: modem
      selector:
        text:
    method:
      required: true
      example: get_slot_config
      selector:
        text:
    params:
      required: false
      example: '{"bus": "0001:01:00.0"}'
      selector:
        object:
