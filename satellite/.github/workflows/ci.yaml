name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ci/.esphome
          key: esphome-${{ hashFiles('yapaia-satellite.yaml', 'ci/test.yaml') }}
          restore-keys: esphome-
      - run: pip install esphome
      - name: Konfiguration prüfen
        run: esphome config ci/test.yaml
      - name: Firmware bauen
        run: esphome compile ci/test.yaml
      - name: Beispiel-Gerätedatei prüfen (mit Platzhaltern)
        run: |
          printf 'yapaia_satellite_api_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="\nwifi_ssid: ci\nwifi_password: ci-dummy-password\n' > secrets.yaml
          sed 's#url: https://github.com/Apfelsafft/Yapaia-Satellite#url: https://github.com/${{ github.repository }}#; s#ref: main#ref: ${{ github.head_ref || github.ref_name }}#' yapaia-satellite.beispiel.yaml > beispiel-ci.yaml
          esphome config beispiel-ci.yaml
