# Wasserstand – kapazitiver Füllstandssensor (ENTWURF, ungetestet)
# Siehe README.md. Kalibrierung: Tank leer → „Leer übernehmen“, Tank voll →
# „Voll übernehmen“. Zum Ausmessen der Rohwerte setup_mode auf true stellen.

esphome:
  name: waterlevel
  friendly_name: Wasserstand

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret waterlevel_api_key

ota:
  - platform: esphome
    password: !secret waterlevel_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Waterlevel Fallback Hotspot"
    password: !secret waterlevel_ap_password

captive_portal:

esp32_touch:
  setup_mode: false

binary_sensor:
  # Nur als Träger für den Rohwert; Schwelle so hoch, dass er nie auslöst.
  - platform: esp32_touch
    id: touch_mess
    internal: true
    pin: GPIO1
    threshold: 4000000

number:
  - platform: template
    id: roh_leer
    name: "Rohwert leer"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 4000000
    step: 1
    initial_value: 0
  - platform: template
    id: roh_voll
    name: "Rohwert voll"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 4000000
    step: 1
    initial_value: 1
  - platform: template
    id: tank_hoehe
    name: "Tankhöhe"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 50
    step: 0.5
    initial_value: 40
    unit_of_measurement: cm

sensor:
  - platform: template
    id: rohwert
    name: "Rohwert"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: return id(touch_mess).get_value();
    filters:
      - median:
          window_size: 7
          send_every: 5

  - platform: template
    id: fuellstand
    name: "Füllstand"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      const float leer = id(roh_leer).state, voll = id(roh_voll).state;
      if (isnan(id(rohwert).state) || voll == leer) return NAN;
      float p = (id(rohwert).state - leer) / (voll - leer) * 100.0f;
      return std::max(0.0f, std::min(100.0f, p));
    filters:
      # Schwappen während der Fahrt glätten
      - sliding_window_moving_average:
          window_size: 12
          send_every: 1

  - platform: template
    name: "Wasserhöhe"
    unit_of_measurement: cm
    accuracy_decimals: 1
    update_interval: 5s
    lambda: return id(fuellstand).state * id(tank_hoehe).state / 100.0f;

button:
  - platform: template
    name: "Leer übernehmen"
    entity_category: config
    on_press:
      - number.set:
          id: roh_leer
          value: !lambda return id(rohwert).state;
  - platform: template
    name: "Voll übernehmen"
    entity_category: config
    on_press:
      - number.set:
          id: roh_voll
          value: !lambda return id(rohwert).state;
