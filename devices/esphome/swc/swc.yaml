esphome:
  name: swc
  friendly_name: SWC

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret swc_api_key

ota:
  - platform: esphome
    #password: "<entfernt>"
    password: !secret swc_ota_password

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
 # - ssid: !secret womo_wifi_ssid
 #   password: !secret womo_wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Swc Fallback Hotspot"
    password: !secret swc_ap_password

captive_portal:

uart:
  - rx_pin: GPIO4
    baud_rate: 9600


# Declare GPS module
gps:
  update_interval: 500ms
  latitude:
    name: "Latitude32"
  longitude:
    name: "Longitude32"
  altitude:
    name: "Altitude32"
  speed:
    name: "Speed32"
    accuracy_decimals: 0
  course:
    name: "Course32"
  satellites:
    name: "Satellites32"
# GPS as time source
time:
  - platform: gps
    #name: "GPS Time"
    id: gps_time


sensor:
# Example source sensor:
  - platform: adc
    name: SWC 1
    id: in_swc1
    pin: GPIO1
    attenuation: auto
    update_interval: 0.1s

# Example source sensor:
  - platform: adc
    name: SWC 2
    id: in_swc2
    pin: GPIO2
    attenuation: auto
    update_interval: 0.1s

output:
  - platform: x9cr
    id: swc1
    cs_pin: GPIO7 #gn
    inc_pin: GPIO5 #vio
    ud_pin: GPIO6 #yw
    initial_value: 0.01
    step_delay: 10us

  - platform: x9cr
    id: swc2
    cs_pin: GPIO21 #gn
    inc_pin: GPIO10 #vio
    ud_pin: GPIO20 #yw
    initial_value: 0.01
    step_delay: 10us


number:
  - platform: template
    id: SWC_1_Slider
    name: "SWC1 Input"
    optimistic: true
    min_value: -5
    max_value: 105
    initial_value: 0.5
    step: 1
    on_value:
      then:
        - output.set_level:
            id: swc1
            level: !lambda |-
                    return x/100.0;

  - platform: template
    id: SWC_2_Slider
    name: "SWC2 Input"
    optimistic: true
    min_value: -5
    max_value: 105
    initial_value: 0.5
    step: 1
    on_value:
      then:
        - output.set_level:
            id: swc2
            level: !lambda |-
                    return x/100.0;

switch:
  - platform: template
    name: "Function 1"
    id: fc1
    optimistic: true
    on_turn_on:
    - output.set_level:
       id: swc1
       level: 0.9
    - delay: 1000ms
    - output.set_level:
       id: swc1
       level: 0.01
    - switch.turn_off: fc1

  - platform: template
    name: "Function 2"
    id: fc2
    optimistic: true
    on_turn_on:
    - output.set_level:
       id: swc1
       level: 0.7
    - delay: 1000ms
    - output.set_level:
       id: swc1
       level: 0.01
    - switch.turn_off: fc2

  - platform: template
    name: "Function 3 03 swc1"
    id: fc3
    optimistic: true
    on_turn_on:
    - output.set_level:
       id: swc1
       level: 0.3
    - delay: 1000ms
    - output.set_level:
       id: swc1
       level: 0.01
    - switch.turn_off: fc3

  - platform: template
    name: "Function 4 03 swc2"
    id: fc4
    optimistic: true
    on_turn_on:
    - output.set_level:
       id: swc2
       level: 0.3
    - delay: 1000ms
    - output.set_level:
       id: swc2
       level: 0.01
    - switch.turn_off: fc4
