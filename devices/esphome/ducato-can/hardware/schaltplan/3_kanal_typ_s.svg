6" y="-198.2" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="57.6" dy="11">+3V3</tspan></text><text x="-70.2" y="-108.19999999999999" dominant-baseline="central" fill="#1f4e9c" font-size="11" font-family="sans" text-anchor="end"><tspan x="-70.2" dy="11">Kn_RS</tspan></text><text x="-70.2" y="-72.2" dominant-baseline="central" fill="#1f4e9c" font-size="11" font-family="sans" text-anchor="end"><tspan x="-70.2" dy="11">Kn_D</tspan></text><text x="-70.2" y="-36.2" dominant-baseline="central" fill="#1f4e9c" font-size="11" font-family="sans" text-anchor="end"><tspan x="-70.2" dy="11">Kn_RX</tspan></text><text x="185.4" y="-115.39999999999999" dominant-baseline="central" fill="#1f4e9c" font-size="11" font-family="sans" text-anchor="start"><tspan x="185.4" dy="11">Xn-1 CAN-H</tspan></text><text x="185.4" y="-79.4" dominant-baseline="central" fill="#1f4e9c" font-size="11" font-family="sans" text-anchor="start"><tspan x="185.4" dy="11">Xn-2 CAN-L</tspan></text><text x="136.8" y="-43.4" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="136.8" dy="11">   offen</tspan></text><text x="466.2" y="-86.60000000000001" dominant-baseline="central" fill="#1f4e9c" font-size="11" font-family="sans" text-anchor="end"><tspan x="466.2" dy="11">Kn_D</tspan></text><text x="518.4" y="-106.60000000000001" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="518.4" dy="11">Rn1</tspan><tspan x="518.4" dy="11">10 kΩ</tspan></text><text x="568.8000000000001" y="-101.0" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="568.8000000000001" dy="11">+3V3</tspan></text><text x="466.2" y="-21.799999999999997" dominant-baseline="central" fill="#1f4e9c" font-size="11" font-family="sans" text-anchor="end"><tspan x="466.2" dy="11">Kn_D</tspan></text><circle cx="504.72" cy="-7.2" r="4.32" style="stroke:black;fill:white;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="532.08" cy="-7.2" r="4.32" style="stroke:black;fill:white;stroke-width:1.3;stroke-dasharray:-;" /><text x="518.4" y="-49.0" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="518.4" dy="11">JPn_TX (Steckbrücke)</tspan><tspan x="518.4" dy="11">offen = nur lesen</tspan></text><text x="577.8000000000001" y="-21.799999999999997" dominant-baseline="central" fill="#1f4e9c" font-size="11" font-family="sans" text-anchor="start"><tspan x="577.8000000000001" dy="11">Kn_TX</tspan></text><text x="466.2" y="43.0" dominant-baseline="central" fill="#1f4e9c" font-size="11" font-family="sans" text-anchor="end"><tspan x="466.2" dy="11">+3V3</tspan></text><text x="518.4" y="34.0" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="518.4" dy="11">Cn1  100 nF</tspan></text><text x="466.2" y="107.80000000000001" dominant-baseline="central" fill="#1f4e9c" font-size="11" font-family="sans" text-anchor="end"><tspan x="466.2" dy="11">Xn-1 CAN-H</tspan></text><text x="518.4" y="98.80000000000001" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="518.4" dy="11">Dn1  PESD1CAN</tspan></text><text x="466.2" y="172.60000000000002" dominant-baseline="central" fill="#1f4e9c" font-size="11" font-family="sans" text-anchor="end"><tspan x="466.2" dy="11">Xn-2 CAN-L</tspan></text><text x="518.4" y="163.60000000000002" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="518.4" dy="11">(2. Diode im selben Gehäuse)</tspan></text><text x="491.40000000000003" y="264.59999999999997" dominant-baseline="ideographic" fill="black" font-size="9" font-family="sans" text-anchor="start"><tspan x="491.40000000000003" dy="9">1: +3V3 (Nur hören)</tspan></text><text x="491.40000000000003" y="286.2" dominant-baseline="ideographic" fill="black" font-size="9" font-family="sans" text-anchor="start"><tspan x="491.40000000000003" dy="9">2: Kn_RS</tspan></text><text x="491.40000000000003" y="307.79999999999995" dominant-baseline="ideographic" fill="black" font-size="9" font-family="sans" text-anchor="start"><tspan x="491.40000000000003" dy="9">3: GND (Normal)</tspan></text><text x="464.40000000000003" y="284.2" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="464.40000000000003" dy="11">JPn_RS</tspan></text><text x="-212.4" y="152.0" dominant-baseline="hanging" fill="#555555" font-size="10" font-family="sans" text-anchor="start"><tspan x="-212.4" dy="10">Kein 120-Ω-Abschluss: Der Bus im Auto ist schon abgeschlossen.</tspan><tspan x="-212.4" dy="10" /><tspan x="-212.4" dy="10">Nur lesen, dreifach abgesichert:</tspan><tspan x="-212.4" dy="10">• JPn_TX offen: Der Sender bekommt kein Signal, Rn1 hält D auf „rezessiv“.</tspan><tspan x="-212.4" dy="10">• JPn_RS auf 1–2 (Rs an +3V3): Treiber im Chip abgeschaltet, Empfänger läuft.</tspan><tspan x="-212.4" dy="10">  Nur falls der Empfang so nicht geht: 2–3 (Rs an GND). JPn_TX bleibt offen.</tspan><tspan x="-212.4" dy="10">Dazu kommt der Nur-Hören-Modus in der Firmware.</tspan><tspan x="-212.4" dy="10" /><tspan x="-212.4" dy="10">Bestückung: K1 = U2 (Kn_RX = GPIO3, Kn_TX = GPIO2, Klemme X1)</tspan><tspan x="-212.4" dy="10">                  K2 = U3 (GPIO7 / GPIO6, Klemme X2)</tspan><tspan x="-212.4" dy="10">                  K3 = U4 (U6 RXCAN / U6 TXCAN, Klemme X3; nur Plan A)</tspan></text><text x="-208.8" y="-285.2" dominant-baseline="central" fill="black" font-size="15" font-family="sans" text-anchor="start"><tspan x="-208.8" dy="15">Blatt 3: CAN-Kanal Typ S – klassischer CAN (SN65HVD230)</tspan></text><text x="-208.8" y="-251.39999999999995" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="start"><tspan x="-208.8" dy="10">Einmal je Kanal bestücken; n = Kanalnummer 1, 2 oder 3</tspan></text><circle cx="478.8" cy="273.6" r="3.6" style="stroke:black;fill:white;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="478.8" cy="295.2" r="3.6" style="stroke:black;fill:white;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="478.8" cy="316.8" r="3.6" style="stroke:black;fill:white;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="737.394" cy="327.6" r="0.36" style="stroke:white;fill:white;stroke-width:1.3;stroke-dasharray:-;" /></svg>