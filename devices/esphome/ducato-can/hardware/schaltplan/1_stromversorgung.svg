ext-anchor="start"><tspan x="135.0" dy="11">D2</tspan><tspan x="135.0" dy="11">SMBJ24A</tspan></text><text x="322.76032291267137" y="21.19999999999999" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="322.76032291267137" dy="11">C1</tspan><tspan x="322.76032291267137" dy="11">47 µF</tspan><tspan x="322.76032291267137" dy="11">50 V</tspan></text><text x="379.8" y="26.69999999999999" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="379.8" dy="11">C2</tspan><tspan x="379.8" dy="11">100 nF</tspan></text><text x="610.1999999999999" y="26.69999999999999" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="610.1999999999999" dy="11">C3</tspan><tspan x="610.1999999999999" dy="11">10 µF</tspan></text><text x="241.20000000000002" y="-65.0" dominant-baseline="ideographic" fill="#1f4e9c" font-size="11" font-family="sans" text-anchor="middle"><tspan x="241.20000000000002" dy="11">+12V_S</tspan></text><text x="-12.6" y="189.0" dominant-baseline="ideographic" fill="black" font-size="9" font-family="sans" text-anchor="end"><tspan x="-12.6" dy="9">1: OBD 4 Karosseriemasse</tspan></text><text x="-12.6" y="210.6" dominant-baseline="ideographic" fill="black" font-size="9" font-family="sans" text-anchor="end"><tspan x="-12.6" dy="9">2: OBD 5 Signalmasse</tspan></text><text x="0.0" y="172.6" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="0.0" dy="11">X4</tspan></text><text x="48.59999999999999" y="241.72000000000003" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="48.59999999999999" dy="11">GND</tspan></text><text x="219.6" y="173.6" dominant-baseline="hanging" fill="#555555" font-size="10" font-family="sans" text-anchor="start"><tspan x="219.6" dy="10">JP0 (Quelle): 1–2 = Dauerplus vom OBD-Port, 2–3 = Zündungsplus über Klemme X5.</tspan><tspan x="219.6" dy="10">+12V_S geht zusätzlich an U5 BAT (nur Plan B/D).</tspan><tspan x="219.6" dy="10">+5V geht an ESP32-Board 5V (J1-14) und an U5 VCC (nur Plan B/D).</tspan><tspan x="219.6" dy="10">+3V3 liefert der Spannungsregler auf dem ESP32-Board (J1-1).</tspan><tspan x="219.6" dy="10">Er versorgt U2–U4 und U6, zusammen ca. 40 mA.</tspan></text><text x="-118.83600000000001" y="-144.8" dominant-baseline="central" fill="black" font-size="15" font-family="sans" text-anchor="start"><tspan x="-118.83600000000001" dy="15">Blatt 1: Stromversorgung</tspan></text><text x="-118.83600000000001" y="-111.00000000000001" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="start"><tspan x="-118.83600000000001" dy="10">Bordnetz 12 V, abgesichert und gegen Verpolung und Spitzen geschützt, auf 5 V</tspan></text><circle cx="0" cy="-21.6" r="3.6" style="stroke:black;fill:white;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="0" cy="-0" r="3.6" style="stroke:black;fill:white;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="0" cy="21.6" r="3.6" style="stroke:black;fill:white;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="115.2" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="244.8" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="302.4" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="360" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="590.4" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="0" cy="198" r="3.6" style="stroke:black;fill:white;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="0" cy="219.6" r="3.6" style="stroke:black;fill:white;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="36" cy="198" r="2.7" style="stroke:black;fill:black;stroke