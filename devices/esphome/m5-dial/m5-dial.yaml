  - { platform: homeassistant, id: reifen_hr_t, entity_id: "${reifen_hr_temp}" }

text_sensor:
  - platform: homeassistant
    id: yapaia_anweisung
    entity_id: ${entity_praefix}_anweisung
  - platform: homeassistant
    id: yapaia_manoever_art
