  - { platform: homeassistant, id: licht1_zustand, entity_id: "${licht1}" }
  - { platform: homeassistant, id: licht2_zustand, entity_id: "${licht2}" }
  - { platform: homeassistant, id: licht3_zustand, entity_id: "${licht3}" }
