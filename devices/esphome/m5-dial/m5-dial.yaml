# ─── Yapaia auf dem M5Stack Dial ────────────────────────────────────────────
#
# Ein Drehknopf mit rundem Display fuers Wohnmobil: dieselbe Navigations-
# anzeige und dieselbe Wasserwaage wie `yapaia-nav-display/` -- und dazu
# Licht, Heizung, Batterie, Gas, Reifendruck und eine Uhr mit Tuerschloss.
#
# Gebaut fuer den **M5Stack Dial** (V1/V1.1): ein M5StampS3 (**ESP32-S3**,
# 8 MB Flash, KEIN PSRAM), ein rundes 1,28-Zoll-Display mit 240x240
# Bildpunkten (GC9A01A an SPI), der orange Drehring (Drehgeber) und darunter
# ein Taster: man drueckt auf das ganze Display.
#
# ─── BEDIENUNG ──────────────────────────────────────────────────────────────
#
#   kurz druecken   naechste Ansicht
#   drehen          verstellen, was die Ansicht verstellen kann
#   lang druecken   die Auswahl in der Ansicht wechseln
#
#   Ansicht      drehen                        lang druecken
#   ─────────    ──────────────────────────    ──────────────────────────────
#   Navi         rechts Restzeit, links Ankunft  Restzeit <-> Ankunft
#   Waage        rechts Fahrzeug, links Libelle  Libelle <-> Fahrzeug
#   Licht        Helligkeit (bis 0 = aus)        naechstes Licht
#   Heizung      Solltemperatur (unter 5 = aus)  Raum <-> Warmwasser
#   Batterie     --                              Batterie 1 <-> 2
#   Gas          --                              --
#   Reifen       --                              --
#   Uhr          Helligkeit des Displays         Tuer zu / (zweimal) auf
#
# Steht eine Abbiegung kurz bevor (`navi_vorrang_m`), springt die Anzeige von
# selbst auf die Navigation -- es sei denn, man hat gerade eben am Knopf
# gedreht oder gedrueckt.
#
# ─── WORAUS DIE WERTE KOMMEN, UND WOHIN DIE BEFEHLE GEHEN ───────────────────
# Alles kommt aus Home Assistant, ueber die native ESPHome-API -- auch die
# Werte der ANDEREN ESPHome-Geraete (heizung, smartwomo, btcollector, door).
# Der Dial spricht nie direkt mit ihnen.
#
# Verstellt wird ebenfalls ueber Home Assistant (`homeassistant.action`). Das
# muss dort EINMAL erlaubt werden, sonst passiert beim Drehen nichts:
#
#   Einstellungen -> Geraete & Dienste -> ESPHome -> dieses Geraet ->
#   Konfigurieren -> „Dem Geraet erlauben, Home-Assistant-Aktionen
#   auszufuehren" einschalten.
#
# WLAN-Zugangsdaten und der API-Schluessel stehen in `secrets.yaml`.

substitutions:
  geraetename: m5-dial
  anzeigename: "Yapaia Dial"
  zeitzone: Europe/Berlin

  # ─── WELCHE ANSICHTEN, IN WELCHER REIHENFOLGE ─────────────────────────────
  # Kurz druecken geht diese Liste der Reihe nach durch. Wer etwas nicht hat
  # (keine Gasflaschen-Sensoren, keine Reifendrucksensoren), nimmt die Nummer
  # heraus -- dann taucht die Ansicht gar nicht erst auf.
  #
  #   0 Navi   1 Waage   2 Licht   3 Heizung
  #   4 Batterie   5 Gas   6 Reifen   7 Uhr
  seiten: "0, 1, 2, 3, 4, 5, 6, 7"

  # Ab wie vielen Metern vor dem naechsten Manoever die Navigation von selbst
  # nach vorn kommt. `0` schaltet das ab.
  navi_vorrang_m: "300"
  # Wie lange nach dem letzten Dreh oder Druck der Vorrang wartet (ms) --
  # wer gerade das Licht dimmt, will nicht mitten darin weggeschaltet werden.
  navi_vorrang_ruhe_ms: "10000"

  # ─── YAPAIA GO ────────────────────────────────────────────────────────────
  # Wie in `yapaia-nav-display.yaml`.
  entity_praefix: sensor.yapaia_go
  entity_praefix_binaer: binary_sensor.yapaia_go

  # ─── DIE WASSERWAAGE ──────────────────────────────────────────────────────
  # Dieselben Werte wie in `yapaia-nav-display.yaml` -- dort steht auch, was
  # sie bedeuten und dass beide Vorzeichen am Fahrzeug nachgeprueft sind.
  entity_neigung_lr: sensor.heizung_neigung_links_rechts
  entity_neigung_vh: sensor.heizung_neigung_vorne_hinten
  wasserwaage_gerade_grad: "0.5"
  wasserwaage_bereich_grad: "5"
  radstand_mm: "4035"
  spurweite_mm: "1810"
  neigung_lr_vorzeichen: "1"
  neigung_vh_vorzeichen: "1"

  # ─── DIE LICHTER (Geraet „smartwomo") ─────────────────────────────────────
  # Acht dimmbare Ausgaenge. Die Namen sind nur fuer die Anzeige -- „OUT3"
  # sagt im Dunkeln niemandem etwas, „Vorzelt" schon. Kurz halten: es sind
  # rund 14 Zeichen Platz.
  licht_anzahl: "8"
  licht1: light.smartwomo_ausgang_out1
  licht1_name: "Ausgang 1"
  licht2: light.smartwomo_ausgang_out2
  licht2_name: "Ausgang 2"
  licht3: light.smartwomo_ausgang_out3
  licht3_name: "Ausgang 3"
  licht4: light.smartwomo_ausgang_out4
  licht4_name: "Ausgang 4"
  licht5: light.smartwomo_ausgang_out5
  licht5_name: "Ausgang 5"
  licht6: light.smartwomo_ausgang_out6
  licht6_name: "Ausgang 6"
  licht7: light.smartwomo_ausgang_out7
  licht7_name: "Ausgang 7"
  licht8: light.smartwomo_ausgang_out8
  licht8_name: "Ausgang 8"
  # Prozent je Rastung des Drehrings.
  licht_schritt: "5"

  # ─── DIE HEIZUNG (Geraet „heizung", Truma iNet Box) ───────────────────────
  # Gelesen wird der GEMELDETE Sollwert (`…_reported`), gestellt wird ueber
  # die `number`-Entitaet -- genau so trennt die iNet-Box es selbst.
  heiz_raum_ist: sensor.heizung_current_room_temperature
  heiz_raum_soll: sensor.heizung_target_room_temperature_reported
  heiz_raum_nummer: number.heizung_target_room_temperature
  heiz_raum_aktiv: binary_sensor.heizung_room_heater_active
  heiz_wasser_ist: sensor.heizung_current_water_temperature
  heiz_wasser_soll: sensor.heizung_target_water_temperature_reported
  heiz_wasser_nummer: number.heizung_target_water_temperature
  heiz_wasser_aktiv: binary_sensor.heizung_water_heater_active

  # ─── DIE BATTERIEN (Geraet „btcollector", Victron SmartShunt) ─────────────
  batt1_name: "Aufbau"
  batt1_soc: sensor.btcollector_state_of_charge
  batt1_spannung: sensor.btcollector_battery_voltage
  batt1_strom: sensor.btcollector_current
  batt1_rest: sensor.btcollector_time_remaining
  batt2_name: "Batterie 2"
  batt2_soc: sensor.btcollector_state_of_charge_2
  batt2_spannung: sensor.btcollector_battery_voltage_2
  batt2_strom: sensor.btcollector_current_2
  batt2_rest: sensor.btcollector_time_remaining_2
  solar_leistung: sensor.btcollector_mppt_pv_power

  # ─── GAS (Mopeka) ─────────────────────────────────────────────────────────
  gas1: sensor.btcollector_gas_sensor_1_level
  gas1_name: "Flasche 1"
  gas2: sensor.btcollector_gas_sensor_2_level
  gas2_name: "Flasche 2"

  # ─── REIFENDRUCK (TPMS) ───────────────────────────────────────────────────
  reifen_vl_druck: sensor.btcollector_fl_pressure
  reifen_vr_druck: sensor.btcollector_fr_pressure
  reifen_hl_druck: sensor.btcollector_rl_pressure
  reifen_hr_druck: sensor.btcollector_rr_pressure
  reifen_vl_temp: sensor.btcollector_fl_temperature
  reifen_vr_temp: sensor.btcollector_fr_temperature
  reifen_hl_temp: sensor.btcollector_rl_temperature
  reifen_hr_temp: sensor.btcollector_rr_temperature
  # Darunter wird ein Reifen rot. Bitte den Wert aus der Reifentabelle des
  # Fahrzeugs nehmen -- ein Ducato traegt hinten deutlich mehr als vorn.
  reifen_warn_bar: "4.0"

  # ─── DIE TUER (Geraet „door") ─────────────────────────────────────────────
  tuer_schloss: lock.door_aufbautur

  # ─── PINS DES M5STACK DIAL ────────────────────────────────────────────────
  pin_sck: GPIO6
  pin_mosi: GPIO5
  pin_cs: GPIO7
  pin_dc: GPIO4
  pin_reset: GPIO8
  pin_backlight: GPIO9
  pin_dreh_a: GPIO40
  pin_dreh_b: GPIO41
  pin_taster: GPIO42
  pin_summer: GPIO3
  pin_halten: GPIO46
  pin_sda: GPIO11
  pin_scl: GPIO12

esphome:
  name: ${geraetename}
  friendly_name: ${anzeigename}
  on_boot:
    # ─── SELBSTHALTUNG ────────────────────────────────────────────────────
    # Am Akku haelt sich der Dial ueber GPIO46 selbst eingeschaltet; ohne das
    # geht er nach dem Loslassen des Tasters wieder aus. Am Bordnetz (USB oder
    # Port A) schadet es nicht.
    - priority: 900
      then:
        - output.turn_on: halten
    - priority: 600
      then:
        - pcf8563.read_time:

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    # secrets.yaml:   m5_dial__api_key: "…"   (32 Byte base64)
    key: !secret m5_dial__api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${geraetename} Fallback"

captive_portal:

i2c:
  - id: intern
    sda: ${pin_sda}
    scl: ${pin_scl}

time:
  - platform: homeassistant
    id: ha_zeit
    timezone: ${zeitzone}
    on_time_sync:
      then:
        - pcf8563.write_time:
            id: rtc_zeit
  # Die eingebaute Uhr: nach einem Neustart ohne WLAN steht so trotzdem die
  # richtige Zeit da.
  - platform: pcf8563
    id: rtc_zeit
    i2c_id: intern
    address: 0x51
    update_interval: never

# ─── WAS SICH DER DIAL MERKT ────────────────────────────────────────────────
# `*_bis` sind Zeitpunkte in `millis()`. Bis dahin zeigt die Anzeige den GERADE
# GEDREHTEN Wert statt des gemeldeten -- sonst spraenge die Zahl beim Drehen
# zurueck, bis Home Assistant den neuen Stand bestaetigt hat.
globals:
  - id: ansicht
    type: int
    restore_value: true
    initial_value: "0"
  - id: letzte_bedienung
    type: uint32_t
    initial_value: "0"
  - id: seitenwechsel
    type: uint32_t
    initial_value: "0"
  - id: licht_wahl
    type: int
    restore_value: true
    initial_value: "0"
  - id: licht_soll
    type: int
    initial_value: "-1"
  - id: licht_soll_bis
    type: uint32_t
    initial_value: "0"
  - id: heiz_wahl
    type: int
    initial_value: "0"
  - id: raum_soll_neu
    type: float
    initial_value: "-1"
  - id: wasser_soll_neu
    type: int
    initial_value: "-1"
  - id: heiz_soll_bis
    type: uint32_t
    initial_value: "0"
  - id: batterie_wahl
    type: int
    initial_value: "0"
  - id: tuer_bestaetigen_bis
    type: uint32_t
    initial_value: "0"
  - id: hell_anzeige_bis
    type: uint32_t
    initial_value: "0"

# ─── DIE BEDIENUNG ──────────────────────────────────────────────────────────
script:
  # Kurz druecken: naechste Ansicht aus `seiten`.
  - id: kurz
    then:
      - lambda: |-
          static const int S[] = {${seiten}};
          const int n = sizeof(S) / sizeof(S[0]);
          int pos = 0;
          for (int i = 0; i < n; i++) if (S[i] == id(ansicht)) pos = i;
          id(ansicht) = S[(pos + 1) % n];
          id(letzte_bedienung) = millis();
          id(seitenwechsel) = millis();
          id(tuer_bestaetigen_bis) = 0;
          id(anzeige).update();

  # Lang druecken: die Auswahl IN der Ansicht.
  - id: lang
    then:
      - lambda: |-
          id(letzte_bedienung) = millis();
          switch (id(ansicht)) {
            case 0: id(eta_als_restzeit).toggle(); break;
            case 1: id(waage_fahrzeug).toggle(); break;
            case 2:
              id(licht_wahl) = (id(licht_wahl) + 1) % (${licht_anzahl});
              id(licht_soll_bis) = 0;
              break;
            case 3:
              id(heiz_wahl) = 1 - id(heiz_wahl);
              id(heiz_soll_bis) = 0;
              break;
            case 4: id(batterie_wahl) = 1 - id(batterie_wahl); break;
            case 7: {
              // ─── DIE TUER GEHT NUR MIT ZWEI GRIFFEN AUF ───────────────────
              // Abschliessen ist immer ungefaehrlich und geht sofort.
              // Aufschliessen kann aus Versehen passieren -- ein Knopf in der
              // Hosentasche, ein Kind am Armaturenbrett. Deshalb muss man es
              // innerhalb von fuenf Sekunden ein zweites Mal wollen.
              const std::string z = id(tuer_zustand).state;
              if (z != "locked") {
                id(tuer_zu).execute();
              } else if ((int32_t) (id(tuer_bestaetigen_bis) - millis()) > 0) {
                id(tuer_bestaetigen_bis) = 0;
                id(tuer_auf).execute();
              } else {
                id(tuer_bestaetigen_bis) = millis() + 5000;
              }
              break;
            }
            default: break;
          }
          id(anzeige).update();

  # Drehen. `richtung` ist +1 (im Uhrzeigersinn) oder -1.
  - id: drehen
    parameters:
      richtung: int
    then:
      - lambda: |-
          id(letzte_bedienung) = millis();
          const uint32_t jetzt = millis();
          switch (id(ansicht)) {
            // Ein Umschalter am Drehring: RECHTS ist immer die eine Seite,
            // LINKS die andere. Wer weiterdreht, bleibt dort -- ein Wechsel
            // je Rastung liesse die Anzeige beim Drehen hin- und herspringen.
            case 0:
              if (richtung > 0) id(eta_als_restzeit).turn_on();
              else id(eta_als_restzeit).turn_off();
              break;
            case 1:
              if (richtung > 0) id(waage_fahrzeug).turn_on();
              else id(waage_fahrzeug).turn_off();
              break;
            case 2: {
              esphome::text_sensor::TextSensor *zust[8] = {
                id(licht1_zustand), id(licht2_zustand), id(licht3_zustand), id(licht4_zustand),
                id(licht5_zustand), id(licht6_zustand), id(licht7_zustand), id(licht8_zustand)};
              esphome::sensor::Sensor *hell[8] = {
                id(licht1_hell), id(licht2_hell), id(licht3_hell), id(licht4_hell),
                id(licht5_hell), id(licht6_hell), id(licht7_hell), id(licht8_hell)};
              const int k = std::max(0, std::min(7, id(licht_wahl)));
              int pct;
              if ((int32_t) (id(licht_soll_bis) - jetzt) > 0 && id(licht_soll) >= 0) {
                pct = id(licht_soll);
              } else if (zust[k]->state == "on") {
                pct = (hell[k]->has_state() && !std::isnan(hell[k]->state))
                          ? (int) (hell[k]->state * 100.0f / 255.0f + 0.5f) : 100;
              } else {
                pct = 0;
              }
              pct = std::max(0, std::min(100, pct + richtung * (${licht_schritt})));
              id(licht_soll) = pct;
              id(licht_soll_bis) = jetzt + 4000;
              id(licht_senden).execute();
              break;
            }
            case 3: {
              if (id(heiz_wahl) == 0) {
                // Truma: 0 heisst aus, sonst 5 bis 30 Grad, in ganzen Graden.
                float soll = ((int32_t) (id(heiz_soll_bis) - jetzt) > 0 && id(raum_soll_neu) >= 0)
                                 ? id(raum_soll_neu)
                                 : (id(heiz_raum_soll_wert)->has_state() &&
                                    !std::isnan(id(heiz_raum_soll_wert)->state)
                                        ? id(heiz_raum_soll_wert)->state : 0.0f);
                if (soll < 5.0f) soll = richtung > 0 ? 5.0f : 0.0f;
                else soll += richtung;
                if (soll < 5.0f) soll = 0.0f;
                if (soll > 30.0f) soll = 30.0f;
                id(raum_soll_neu) = soll;
              } else {
                // Warmwasser kennt nur vier Stufen.
                static const int STUFEN[] = {0, 40, 60, 80};
                int soll = ((int32_t) (id(heiz_soll_bis) - jetzt) > 0 && id(wasser_soll_neu) >= 0)
                               ? id(wasser_soll_neu)
                               : (id(heiz_wasser_soll_wert)->has_state() &&
                                  !std::isnan(id(heiz_wasser_soll_wert)->state)
                                      ? (int) id(heiz_wasser_soll_wert)->state : 0);
                int i = 0;
                for (int j = 0; j < 4; j++) if (soll >= STUFEN[j]) i = j;
                i = std::max(0, std::min(3, i + richtung));
                id(wasser_soll_neu) = STUFEN[i];
              }
              id(heiz_soll_bis) = jetzt + 6000;
              id(heiz_senden).execute();
              break;
            }
            case 7: {
              float b = id(backlight).current_values.get_brightness();
              b = std::max(0.05f, std::min(1.0f, b + richtung * 0.05f));
              auto call = id(backlight).turn_on();
              call.set_brightness(b);
              call.perform();
              id(hell_anzeige_bis) = jetzt + 2000;
              break;
            }
            default: break;
          }
          id(anzeige).update();

  # ─── GESENDET WIRD ERST, WENN DAS DREHEN AUFHOERT ─────────────────────────
  # `mode: restart`: jede Rastung startet die Wartezeit neu. Wer von 0 auf
  # 80 % dreht, schickt EINEN Befehl statt sechzehn -- die Lampen flackern
  # nicht durch alle Zwischenstufen, und Home Assistant bleibt ruhig.
  - id: licht_senden
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: "return id(licht_soll) <= 0;"
          then:
            - homeassistant.action:
                action: light.turn_off
                data:
                  entity_id: !lambda |-
                    static const char *const E[] = {"${licht1}", "${licht2}", "${licht3}", "${licht4}",
                                                    "${licht5}", "${licht6}", "${licht7}", "${licht8}"};
                    return std::string(E[std::max(0, std::min(7, id(licht_wahl)))]);
          else:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda |-
                    static const char *const E[] = {"${licht1}", "${licht2}", "${licht3}", "${licht4}",
                                                    "${licht5}", "${licht6}", "${licht7}", "${licht8}"};
                    return std::string(E[std::max(0, std::min(7, id(licht_wahl)))]);
                  brightness_pct: !lambda "return to_string(id(licht_soll));"

  # Die Heizung wartet laenger: die iNet-Box schreibt jeden Befehl ueber den
  # LIN-Bus ins CP Plus, und dort soll nicht jede Zwischenstufe ankommen.
  - id: heiz_senden
    mode: restart
    then:
      - delay: 800ms
      - if:
          condition:
            lambda: "return id(heiz_wahl) == 0;"
          then:
            - homeassistant.action:
                action: number.set_value
                data:
                  entity_id: ${heiz_raum_nummer}
                  value: !lambda "return to_string((int) id(raum_soll_neu));"
          else:
            - homeassistant.action:
                action: number.set_value
                data:
                  entity_id: ${heiz_wasser_nummer}
                  value: !lambda "return to_string(id(wasser_soll_neu));"

  - id: tuer_zu
    then:
      - homeassistant.action:
          action: lock.lock
          data:
            entity_id: ${tuer_schloss}
  - id: tuer_auf
    then:
      - homeassistant.action:
          action: lock.unlock
          data:
            entity_id: ${tuer_schloss}

binary_sensor:
  # ─── DER TASTER UNTER DEM DISPLAY ─────────────────────────────────────────
  # Er zieht nach Masse, also `inverted`. Kurz und lang werden hier getrennt;
  # „lang" loest schon beim Halten aus, nicht erst beim Loslassen -- so merkt
  # man, wann es reicht.
  - platform: gpio
    id: taster
    pin:
      number: ${pin_taster}
      inverted: true
      mode:
        input: true
        pullup: true
    on_multi_click:
      - timing:
          - ON for at most 600ms
          - OFF for at least 30ms
        then:
          - script.execute: kurz
      - timing:
          - ON for at least 700ms
        then:
          - script.execute: lang

  - platform: homeassistant
    id: yapaia_zu_schnell
    entity_id: ${entity_praefix_binaer}_zu_schnell
    # ─── EIN KURZER TON BEIM UEBERSCHREITEN ─────────────────────────────────
    # Nur, wenn der Schalter „Warnton bei zu schnell" an ist. Einmal beim
    # Ueberschreiten, nicht dauernd -- eine Dauerwarnung stellt man ab.
    on_press:
      - if:
          condition:
            switch.is_on: warnton
          then:
            - rtttl.play: "warn:d=16,o=6,b=180:c,p,c"
  - platform: homeassistant
    id: heiz_raum_aktiv_an
    entity_id: ${heiz_raum_aktiv}
  - platform: homeassistant
    id: heiz_wasser_aktiv_an
    entity_id: ${heiz_wasser_aktiv}

sensor:
  # ─── DER ORANGE DREHRING ──────────────────────────────────────────────────
  # Springt er je Rastung um ZWEI Schritte, hier `resolution: 2` eintragen.
  - platform: rotary_encoder
    id: drehring
    pin_a:
      number: ${pin_dreh_a}
      mode:
        input: true
        pullup: true
    pin_b:
      number: ${pin_dreh_b}
      mode:
        input: true
        pullup: true
    on_clockwise:
      - script.execute:
          id: drehen
          richtung: 1
    on_anticlockwise:
      - script.execute:
          id: drehen
          richtung: -1

  # ─── YAPAIA GO ────────────────────────────────────────────────────────────
  - platform: homeassistant
    id: yapaia_tempo
    entity_id: ${entity_praefix}_tempo
  - platform: homeassistant
    id: yapaia_tempolimit
    entity_id: ${entity_praefix}_tempolimit
  - platform: homeassistant
    id: yapaia_tempolimit_fahrzeug
    entity_id: ${entity_praefix}_tempolimit_fahrzeug
  - platform: homeassistant
    id: yapaia_manoever_entfernung
    entity_id: ${entity_praefix}_anweisung_entfernung
  - platform: homeassistant
    id: neigung_lr
    entity_id: ${entity_neigung_lr}
  - platform: homeassistant
    id: neigung_vh
    entity_id: ${entity_neigung_vh}

  # ─── LICHT: die Helligkeit als Attribut (0..255) ──────────────────────────
  - { platform: homeassistant, id: licht1_hell, entity_id: "${licht1}", attribute: brightness }
  - { platform: homeassistant, id: licht2_hell, entity_id: "${licht2}", attribute: brightness }
  - { platform: homeassistant, id: licht3_hell, entity_id: "${licht3}", attribute: brightness }
  - { platform: homeassistant, id: licht4_hell, entity_id: "${licht4}", attribute: brightness }
  - { platform: homeassistant, id: licht5_hell, entity_id: "${licht5}", attribute: brightness }
  - { platform: homeassistant, id: licht6_hell, entity_id: "${licht6}", attribute: brightness }
  - { platform: homeassistant, id: licht7_hell, entity_id: "${licht7}", attribute: brightness }
  - { platform: homeassistant, id: licht8_hell, entity_id: "${licht8}", attribute: brightness }

  # ─── HEIZUNG ──────────────────────────────────────────────────────────────
