  - { platform: homeassistant, id: batt2_soc_wert, entity_id: "${batt2_soc}" }
  - { platform: homeassistant, id: batt2_spannung_wert, entity_id: "${batt2_spannung}" }
  - { platform: homeassistant, id: batt2_strom_wert, entity_id: "${batt2_strom}" }
