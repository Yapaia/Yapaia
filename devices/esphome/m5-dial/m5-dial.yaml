  # ─── GAS, REIFEN ──────────────────────────────────────────────────────────
  - { platform: homeassistant, id: gas1_wert, entity_id: "${gas1}" }
  - { platform: homeassistant, id: gas2_wert, entity_id: "${gas2}" }
