  - id: c_pfeil
    hex: "4EA1FF"
  - id: c_warnung
    hex: "FF4D4D"
  - id: c_gut
    hex: "3DDC84"
  # Das Orange des Drehrings -- alles, was sich drehen laesst, traegt es.
  - id: c_akzent
    hex: "FF8A1F"
