  - { platform: homeassistant, id: heiz_wasser_soll_wert, entity_id: "${heiz_wasser_soll}" }

  # ─── BATTERIE, SOLAR ──────────────────────────────────────────────────────
  - { platform: homeassistant, id: batt1_soc_wert, entity_id: "${batt1_soc}" }
  - { platform: homeassistant, id: batt1_spannung_wert, entity_id: "${batt1_spannung}" }
