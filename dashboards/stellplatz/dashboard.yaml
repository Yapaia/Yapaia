# Dashboard „Stellplatz“ – Rohkonfiguration
# (Dashboard → ⋮ → Bearbeiten → ⋮ → Raw-Konfigurationseditor)
# Einspielen geht auch mit: python3 dashboards/deploy.py --dashboard stellplatz
title: Stellplatz
views:
  - title: Stellplatz
    path: stellplatz
    icon: mdi:caravan
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Heizung
            icon: mdi:radiator
          - type: thermostat
            entity: climate.heizung_truma_room
            name: Raum
            grid_options: { columns: 6 }
            features:
              - type: climate-hvac-modes
                hvac_modes: ["off", heat]
          - type: thermostat
            entity: climate.heizung_truma_water
            name: Wasser
            grid_options: { columns: 6 }
            features:
              - type: climate-hvac-modes
                hvac_modes: ["off", heat]
          - type: tile
            entity: binary_sensor.heizung_heater_has_error
            name: Störung

      - type: grid
        cards:
          - type: heading
            heading: Licht
            icon: mdi:lightbulb-group
          - { type: tile, entity: light.smartwomo_ausgang_out2, name: Dinette, icon: 'mdi:table-chair' }
          - { type: tile, entity: light.smartwomo_ausgang_out1, name: Außen, icon: 'mdi:outdoor-lamp' }
          - { type: tile, entity: light.smartwomo_ausgang_out5, name: Ambiente, icon: 'mdi:led-strip-variant' }
          - { type: tile, entity: light.smartwomo_ausgang_out6, name: Ambiente Bett, icon: 'mdi:led-strip-variant' }
          - { type: tile, entity: light.smartwomo_ausgang_out4, name: Bett, icon: 'mdi:bed' }
          - { type: tile, entity: light.smartwomo_ausgang_out8, name: Bad, icon: 'mdi:shower' }
          - { type: tile, entity: light.smartwomo_ausgang_out3, name: Eingang, icon: 'mdi:door-open' }
          - { type: tile, entity: light.smartwomo_ausgang_out7, name: Nachtlicht, icon: 'mdi:weather-night' }
          - type: heading
            heading: Tür
            icon: mdi:door
          - type: tile
            entity: lock.door_aufbautur
            name: Aufbautür
            features:
              - type: lock-commands
            features_position: bottom
            vertical: false

      - type: grid
        cards:
          - type: heading
            heading: Batterie
            icon: mdi:car-battery
          - type: gauge
            entity: sensor.btcollector_btcollector_battery_1_state_of_charge
            name: Batterie 1 (BMS)
            min: 0
            max: 100
            severity: { green: 50, yellow: 25, red: 0 }
            grid_options: { columns: 6 }
          - type: gauge
            entity: sensor.btcollector_btcollector_battery_2_state_of_charge
            name: Batterie 2 (BMS)
            min: 0
            max: 100
            severity: { green: 50, yellow: 25, red: 0 }
            grid_options: { columns: 6 }
          - { type: tile, entity: sensor.btcollector_state_of_charge, name: Ladung Shunt 1 }
          - { type: tile, entity: sensor.btcollector_state_of_charge_2, name: Ladung Shunt 2 }
          - { type: tile, entity: sensor.btcollector_battery_voltage, name: Spannung 1 }
          - { type: tile, entity: sensor.btcollector_battery_voltage_2, name: Spannung 2 }
          - { type: tile, entity: sensor.btcollector_current, name: Strom 1 }
          - { type: tile, entity: sensor.btcollector_current_2, name: Strom 2 }
          - { type: tile, entity: sensor.btcollector_btcollector_battery_1_power, name: Leistung 1 }
          - { type: tile, entity: sensor.btcollector_btcollector_battery_2_power, name: Leistung 2 }
          - { type: tile, entity: sensor.btcollector_time_remaining, name: Restlaufzeit 1, icon: mdi:timer-sand }
          - { type: tile, entity: sensor.btcollector_time_remaining_2, name: Restlaufzeit 2, icon: mdi:timer-sand }
          - { type: tile, entity: sensor.batterien_restlaufzeit, name: Restlaufzeit gesamt, icon: mdi:timer-sand-complete }
          - { type: tile, entity: binary_sensor.btcollector_battery_has_alarm, name: Alarm }
          - type: heading
            heading: Gas und Wasser
            icon: mdi:gas-cylinder
          # Kachel statt Tacho: zeigt „Unbekannt“, solange der Sensor nichts liefert
          - { type: tile, entity: sensor.btcollector_gas_sensor_1_level, name: Gas 1, icon: mdi:gas-cylinder }
          # Kachel statt Tacho: zeigt „Unbekannt“, solange der Sensor nichts liefert
          - { type: tile, entity: sensor.btcollector_gas_sensor_2_level, name: Gas 2, icon: mdi:gas-cylinder }
          - { type: tile, entity: sensor.smartwomo_analog_pressure_sensor, name: Wasser, icon: mdi:water }

      - type: grid
        cards:
          - type: heading
            heading: Radio
            icon: mdi:radio
          - type: custom:yapaia-beat-card
            entity: media_player.yapaia_beat
            style: modern
