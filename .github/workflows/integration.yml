name: Integration

on:
  workflow_call: {}
  workflow_dispatch:

defaults:
  run:
    working-directory: integration

jobs:
  tests:
    name: Tests (Home Assistant)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: integration/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q

  hassfest:
    name: hassfest (Manifest, Übersetzungen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # hassfest prüft eine Integration so, wie Home Assistant sie lädt:
      # Manifest-Felder, Übersetzungen, Config-Flow-Angaben.
      - uses: home-assistant/actions/hassfest@master
        with:
          path: integration/custom_components/yapaia
