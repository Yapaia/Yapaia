name: Integration

on:
  workflow_call: {}
  workflow_dispatch:

defaults:
  run:
    working-directory: integration

jobs:
  tests:
    name: Tests (Home Assistant, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Die Python-Version bestimmt, welches Home Assistant pip auflöst: 3.14
    # bringt das aktuelle, 3.13 das letzte, das noch darauf lief. Nur mit
    # beiden fällt auf, wenn HA eine Funktion verschiebt oder entfernt.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: integration/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q

  hassfest:
    name: hassfest (Manifest, Übersetzungen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # hassfest prüft eine Integration so, wie Home Assistant sie lädt:
      # Manifest-Felder, Übersetzungen, Config-Flow-Angaben. Dasselbe Image
      # wie die Action `home-assistant/actions/hassfest` -- die sucht aber
      # fest `custom_components/` an der Repo-Wurzel, unsere liegt in
      # `integration/`.
      - name: hassfest
        working-directory: .
        run: docker run --rm -v "${GITHUB_WORKSPACE}/integration:/github/workspace" ghcr.io/home-assistant/hassfest
