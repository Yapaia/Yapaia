name: Cam

# Baut die Android-App „Yapaia Cam“ unsigniert. Signiert wird auf dem
# Mini-PC mit cam/signieren.sh – der Schlüssel kommt nie ins öffentliche Repo.

on:
  workflow_call: {}
  workflow_dispatch:

defaults:
  run:
    working-directory: cam

jobs:
  apk:
    name: APK bauen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle --no-daemon assembleRelease lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: yapaia-cam-unsigniert
          path: cam/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
