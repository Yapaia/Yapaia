name: Satellite

on:
  workflow_call: {}
  workflow_dispatch:

defaults:
  run:
    working-directory: satellite

jobs:
  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            satellite/ci/.esphome
          key: esphome-${{ hashFiles('satellite/yapaia-satellite.yaml', 'satellite/ci/test.yaml') }}
          restore-keys: esphome-
      - run: pip install esphome
      - name: Konfiguration prüfen
        run: esphome config ci/test.yaml
      - name: Firmware bauen
        run: esphome compile ci/test.yaml
      - name: Beispiel-Gerätedatei prüfen (mit Platzhaltern)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Solange das Repo privat ist, braucht ESPHome für das Paket aus
          # GitHub eine Anmeldung -- das Token dieses Laufs (nur Lesen).
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          printf 'yapaia_satellite_api_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="\nwifi_ssid: ci\nwifi_password: ci-dummy-password\n' > secrets.yaml
          sed 's#url: https://github.com/Yapaia/yapaia#url: https://github.com/${{ github.repository }}#; s#ref: main#ref: ${{ github.head_ref || github.ref_name }}#' yapaia-satellite.beispiel.yaml > beispiel-ci.yaml
          esphome config beispiel-ci.yaml
