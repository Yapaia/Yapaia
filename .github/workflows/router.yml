name: Router

on:
  workflow_call: {}
  workflow_dispatch:

defaults:
  run:
    working-directory: router

jobs:
  tests:
    name: Tests (Home Assistant)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: router/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q

  hassfest:
    name: hassfest (Manifest, Übersetzungen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Wie in integration.yml: hassfest-Image direkt auf den Modulordner.
      - name: hassfest
        working-directory: .
        run: docker run --rm -v "${GITHUB_WORKSPACE}/router:/github/workspace" ghcr.io/home-assistant/hassfest
