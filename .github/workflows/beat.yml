name: Beat

on:
  workflow_call: {}
  workflow_dispatch:

defaults:
  run:
    working-directory: beat

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy aiohttp pytest
      - run: pytest -q tests

  lint-addon:
    name: Add-on-Linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./beat/yapaia_beat"

  build:
    name: Add-on-Image bauen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - name: Build add-on image (amd64)
        run: |
          docker build \
            --build-context yapaia-integration=../integration/custom_components \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:bookworm \
            --build-arg BUILD_VERSION=ci \
            -t yapaia-beat:ci yapaia_beat
      - name: Smoke test
        run: |
          docker run --rm --entrypoint "" -e YAPAIA_DATA=/tmp yapaia-beat:ci \
            bash -c 'welle-cli -v; redsea --version; timeout 5 python3 -m yapaia || test $? -eq 124'
          # die gemeinsame Integration ist im Image
          docker run --rm --entrypoint "" yapaia-beat:ci \
            python3 -c 'import json; print("Integration", json.load(open("/opt/yapaia/integration/yapaia/manifest.json"))["version"])'
