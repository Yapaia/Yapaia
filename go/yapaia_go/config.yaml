# Home Assistant Add-on configuration for Yapaia Go.
#
# Schema reference: https://developers.home-assistant.io/docs/add-ons/configuration
# CI runs a structural check of this file (yapaia_go/config.test.ts); the
# add-on linter runs nightly (.github/workflows/nightly.yml).

name: "Yapaia Go"
description: "Offline-fähige Wohnmobil-Navigation (Karten, Routing, GPS, Home-Assistant-Integration) als HA-Add-on."
slug: "yapaia_go"
version: "0.69.0"
# ─── MINDESTVERSION VON HOME ASSISTANT ──────────────────────────────────────
# Die Optionen sind in aufklappbaren Gruppen verschachtelt. Verschachtelte
# Konfiguration gibt es in Home Assistant erst ab 2025.10 (maximal zwei Ebenen);
# auf älteren Installationen würden die Gruppen nicht gezeichnet.
homeassistant: "2025.10.0"
url: "https://github.com/Yapaia/yapaia"
# Fertiges Image aus .github/workflows/images.yml -- der Supervisor zieht
# `<image>:<version>` statt auf dem Gerät zu bauen.
image: "ghcr.io/yapaia/yapaia-go-{arch}"

# amd64 covers typical Mini-PC/NUC installs; aarch64 covers Raspberry Pi
# 4/5-class HAOS hardware. Other archs are intentionally NOT listed: Valhalla/
# Photon upstream images this add-on bundles do not reliably ship armhf/armv7/
# i386 builds (see DOCS.md "Supported architectures").
arch:
  - amd64
  - aarch64

# Not set, because both would only repeat the Supervisor default (the add-on
# linter rejects redundant keys):
#   startup: application  -- this is the user-facing product, not a
#                            background service other add-ons depend on.
#   boot: auto            -- starts with HAOS; can still be stopped manually.

# We ship our OWN s6-overlay (rootfs/etc/s6-overlay/, see Dockerfile) instead
# of basing on Home Assistant's own base images (which already bundle
# s6-overlay + their own init). `init: false` tells the Supervisor NOT to
# inject a second init/PID-1 on top of ours.
init: false

# Ingress: the add-on UI appears in the HA sidebar, and HA terminates auth +
# remote access (Nabu Casa) for it. The internal container port is the
# Supervisor default (8099), so `ingress_port` is deliberately not set.
ingress: true
panel_icon: "mdi:map-marker-path"
panel_title: "Yapaia Go"

# Ingress-only by default. Direct (non-Ingress) HTTP access is an opt-in that
# can be added locally by uncommenting the block below -- see DOCS.md
# "Direct (non-Ingress) access". Publishing the port means the
# `API_AUTH_TOKEN` bearer-auth path becomes the operative one.
#
# ports:
#   8080/tcp: 8080
# ports_description:
#   8080/tcp: "Optional direct HTTP access (bypasses Ingress). Set an API_AUTH_TOKEN if you enable this."
ports: {}

# Map/routing/search data lives under /share/yapaia/ (host-persistent,
# survives add-on updates/reinstalls), never inside the container's writable
# layer. `share:rw` mounts HAOS's shared /share into the container.
map:
  - share:rw
  # Schreibzugriff auf die HA-Konfiguration: ausschließlich, um die
  # Lovelace-Karte (`lovelace/yapaia-map-card.js`) beim Start nach `www/yapaia/`
  # zu legen. Home Assistant liefert alles unter `www/` als `/local/...` aus --
  # der einzige Pfad, unter dem eine Dashboard-Ressource dauerhaft gültig bleibt
  # (der Ingress-Pfad enthält ein wechselndes Token). Geschrieben wird nur diese
  # eine Datei in genau diesem Unterordner.
  - homeassistant_config:rw

# Grants access to the Mosquitto add-on's broker credentials (needed for
# `bashio::services mqtt`). `want`, not `need`: MQTT is optional, the add-on
# runs fully without a broker.
services:
  - mqtt:want

# ─── USB-GPS ────────────────────────────────────────────────────────────────
# `uart` bildet die seriellen Geräte des Hosts im Container ab, mit dem Recht,
# sie zu öffnen (ohne meldet gpsd „Operation not permitted"). `udev` liefert
# die Ereignisse, an denen ein später eingestecktes Gerät auffällt, `usb` den
# rohen USB-Bus. Das sind Fähigkeiten für den Supervisor, keine Beschriftungen;
# die Option, die man sieht, ist `gps_source` mit dem Wert `usb`.
# Siehe DOCS.md, Abschnitt "USB-GPS".
uart: true

# (`usb` bleibt stehen: ein laufender Empfänger soll nach einem Update nicht
# eine Berechtigung verlieren.)
usb: true
udev: true

# Yapaia -> HA REST calls (HA-TTS output channel, notifications) go through
# the Supervisor's proxied Core API (http://supervisor/core/api +
# SUPERVISOR_TOKEN) instead of a manually configured long-lived token.
hassio_api: true
# Anmeldung bei der zentralen Integration „Yapaia" (Supervisor-Discovery,
# docs/integration-protokoll.md Abschnitt 4).
discovery:
  - yapaia
homeassistant_api: true

# SECURITY POSTURE -- deliberately left at the Supervisor defaults, which are
# already the hardened ones, and therefore not spelled out:
#   full_access: false  -- no elevated container privileges.
#   apparmor:    true   -- AppArmor confinement stays ON.
#   stdin:       false  -- no stdin channel into the container.
# Any future change here is a widening of privileges and must be argued for
# explicitly by ADDING the key with a comment saying why.

# ─── GPS-QUELLE ─────────────────────────────────────────────────────────────
# `gps_source`: usb (GPS-Empfänger am USB-Port, gpsd), network (gpsd auf einem
# anderen Gerät), rut50 (Teltonika-Router über Modbus TCP), companion_app
# (Home-Assistant-Companion-App auf Telefon/Tablet/Autoradio), none (Position
# aus dem Browser).
#
# `rut50_host`: „host" oder „host:port", leer = 192.168.1.1:502. Im Router muss
# unter Services -> Modbus -> Modbus TCP Server der Server laufen; Yapaia liest
# die GPS-Register ab Adresse 143. Andere Teltonika-Router mit GPS und RutOS
# (RUTX50, RUTM50, RUT955 …) haben dieselbe Registerkarte.
#
# `gpsd_host`: nur für `network` – „host" oder „host:port" des entfernten gpsd,
# Port-Vorgabe 2947. Der gpsd im Add-on bleibt dann aus; der gpsd dort muss
# im Netz lauschen (gpsd -G bzw. GPSD_OPTIONS="-G").
#
# `companion_app` genügt für sich allein: gibt es genau einen `device_tracker`
# mit Koordinaten, wählt Yapaia ihn selbst. Bei mehreren wird keiner geraten;
# die Installationsprüfung listet sie, und man trägt den gewünschten in
# `ha_device_tracker` ein (z. B. `device_tracker.mein_telefon`). Das ist der
# Weg, wenn der Browser den GPS-Sensor nicht freigibt (ohne HTTPS nie),
# siehe docs/gps-endgeraete.md.
#
# `region: ""` (leer) ist ein gültiger Zustand: der Core startet dann in den
# Einrichtungsassistenten.
#
# ─── DER WEG ZU HOME ASSISTANT ──────────────────────────────────────────────
# Die Integration „Yapaia" (Gerät „Yapaia Go", docs/integration-protokoll.md)
# bringt das Add-on mit und meldet sich per Supervisor-Discovery an.
# `mqtt_enabled` ergänzt einen MQTT-Broker (Mosquitto-Add-on); aus als Vorgabe.
options:
  region: ""
  # Vorgabe `none` statt `usb`: ein USB-GPS-Empfänger ist Zubehör. Mit `usb`
  # würde die Installationsprüfung bei jeder frischen Installation vor einem
  # nicht vorhandenen gpsd warnen. Bestehende Installationen behalten ihre
  # Einstellung.
  gps_source: "none"
  # `gps_device`: welcher USB-Anschluss der GPS-Empfänger ist. Leer lassen ist
  # der Normalfall; eintragen nur, wenn mehrere serielle Geräte angesteckt sind
  # (z. B. ein Zigbee- oder Z-Wave-Stick) und keines sich als GNSS-Empfänger
  # zu erkennen gibt. Den stabilen Pfad nehmen, nicht /dev/ttyACM0:
  #
  #   /dev/serial/by-id/usb-u-blox_AG_-_www.u-blox.com_u-blox_7_-_GPS_GNSS_Receiver-if00
  #
  # Die Nummer in `ttyACM0` verschiebt sich, sobald ein anderer USB-Stick
  # dazukommt; der `by-id`-Pfad bleibt. Welche Pfade es gibt, zeigt die
  # Installationsprüfung in Yapaia.
  gps_device: ""
  rut50_host: ""
  gpsd_host: ""
  ha_device_tracker: ""
  search:
    photon_enabled: true
    photon_xmx_mb: 1024
  routing:
    valhalla_memory_mb: 2048
  # `display.theme`: Vorgabe für Geräte, die in Yapaia noch nichts gewählt
  # haben; wer dort unter „Design" etwas auswählt, überschreibt sie.
  #   system  folgt der Hell/Dunkel-Einstellung des Geräts
  #   sun     folgt dem Sonnenstand an der eigenen Position
  display:
    theme: "light"
  # ─── ONLINE-DIENSTE ─────────────────────────────────────────────────────
  # Yapaia navigiert vollständig offline. Die Online-Dienste sind eine
  # Ergänzung und aus als Vorgabe. Eingeschaltet darf Yapaia bei bestehender
  # Verbindung die Autobahn GmbH des Bundes (Baustellen, Sperrungen, Warnungen,
  # Rastanlagen, LKW-Parkplätze; ohne Schlüssel) abfragen. Hinaus geht nur die
  # Anfrage selbst, keine Position, keine Route, keine Gerätekennung. Ohne
  # Verbindung fällt nur das weg.
  online:
    enabled: false
    tankerkoenig_api_key: ""
  bord:
    grauwasser: ""
    frischwasser: ""
    batterie: ""
    aussentemperatur: ""
    grauwasser_ab: 80
    frischwasser_bis: 20
    batterie_bis: 30
    frost_bis: 1
  home_assistant:
    mqtt_enabled: false
    mqtt_prefix: "yapaia"
  advanced:
    # `gps_simulator`: schaltet den eingebauten Testfahrer frei. Aus als
    # Vorgabe: der Simulator speist beliebige Positionen ein und verdrängt den
    # echten Empfänger, das darf in einem fahrenden Fahrzeug nicht aus Versehen
    # passieren. Der Core läuft mit NODE_ENV=production; ohne dieses Flag
    # antworten die Simulator-Routen mit 403.
    gps_simulator: false
    log_level: "info"

# ─── GLIEDERUNG ────────────────────────────────────────────────────────────
# Was man wirklich einstellt, steht offen da; der Rest liegt in aufklappbaren
# Blöcken (verschachtelte Schlüssel zeichnet Home Assistant als eigenen,
# zusammenklappbaren Abschnitt). Die Schlüssel sind englisch; was man liest,
# steht in `translations/`. `init-yapaia-config.sh` liest die verschachtelte
# Form und fällt auf die flache zurück (`config_mit_rueckfall`).
schema:
  region: "str?"
  gps_source: "list(usb|network|rut50|companion_app|none)"
  gps_device: "str?"
  rut50_host: "str?"
  gpsd_host: "str?"
  ha_device_tracker: "str?"
  search:
    photon_enabled: "bool"
    photon_xmx_mb: "int(256,4096)"
  routing:
    valhalla_memory_mb: "int(512,8192)"
  display:
    theme: "list(light|dark|system|sun)"
  online:
    enabled: "bool"
    # Seit 0.42.0: kostenloser Schluessel von creativecommons.tankerkoenig.de
    # fuer Spritpreise in der Tankstellensuche. Leer = keine Preise.
    tankerkoenig_api_key: "password?"
  # ─── BORDSENSOREN (seit 0.19.0) ────────────────────────────────────────────
  # Welche HA-Entitaet welchen Wert liefert; leer = diesen Hinweis gibt es
  # nicht. Keine Vorgabe fuer die Entitaeten: jedes Fahrzeug nennt seine
  # Sensoren anders, und ein geratener Name waere ein stiller Fehler.
  bord:
    grauwasser: "str?"
    frischwasser: "str?"
    batterie: "str?"
    aussentemperatur: "str?"
    grauwasser_ab: "int(1,100)"
    frischwasser_bis: "int(0,99)"
    batterie_bis: "int(0,99)"
    frost_bis: "int(-20,10)"
  home_assistant:
    mqtt_enabled: "bool"
    mqtt_prefix: "str"
  advanced:
    gps_simulator: "bool"
    log_level: "list(debug|info|warn|error)"
